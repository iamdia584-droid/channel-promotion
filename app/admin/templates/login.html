<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ platform }}</title>
  <style>
    :root { --bg:#0f1115; --surface:#171a21; --border:#2a2f3a; --text:#e6e9ef;
      --muted:#98a1b3; --accent:#4f8cff; --bad:#e5484d; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
      --bg:#f6f7f9; --surface:#fff; --border:#dfe3ea; --text:#16191f; --muted:#5b6474; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:var(--bg); color:var(--text);
      font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
    .box { background:var(--surface); border:1px solid var(--border); border-radius:12px;
      padding:26px; width:100%; max-width:380px; }
    h1 { font-size:19px; margin:0 0 4px; letter-spacing:-0.015em; }
    p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
    label { display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; }
    input { width:100%; background:transparent; border:1px solid var(--border);
      color:var(--text); padding:9px 11px; border-radius:7px; font:inherit; }
    button { width:100%; margin-top:20px; background:var(--accent); color:#fff;
      border:none; padding:10px; border-radius:7px; font:inherit; font-weight:600;
      cursor:pointer; }
    .err { margin-top:14px; color:var(--bad); font-size:13px; }
    .note { margin-top:16px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <form class="box" method="post" action="/admin/login">
    <h1>{{ platform }}</h1>
    <p class="sub">Staff sign-in</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="totp">Authenticator code <span style="opacity:.6">(if enabled)</span></label>
    <input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9 ]*" placeholder="123456">
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <div class="note">Sessions expire automatically. Every action you take here is
      recorded in the audit log.</div>
  </form>
</body>
</html>
