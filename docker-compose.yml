services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adnet
      POSTGRES_PASSWORD: adnet
      POSTGRES_DB: adnet
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adnet"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    build: .
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app worker -l info -Q default,delivery,money,fraud,notify

  beat:
    build: .
    env_file: [.env]
    depends_on:
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app beat -l info

volumes:
  pgdata:
