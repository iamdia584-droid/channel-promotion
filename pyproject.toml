[project]
name = "adnet"
version = "1.0.0"
description = "Independent third-party Telegram advertising network"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiogram>=3.7",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",     # FastAPI's Depends()/Form() in defaults is the documented idiom
    "RUF012",   # ClassVar annotations on SQLAlchemy __table_args__ add noise
    "RUF001",   # the taka sign and en-dashes are deliberate, not confusables
    "RUF002",
    "RUF003",
    "RUF059",   # `a, b, c = fixture()` naming every element reads better in tests
    "E402",     # main.py imports routers after the app object exists, by necessity
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions to keep fixtures independent and imports local
# to the behaviour under test.
"tests/*" = ["F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:adnet.*"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
